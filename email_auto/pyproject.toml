[project]
name = "email_auto"
version = "0.1.0"
description = "Local daily email digest powered by IMAP and mlx-lm"
authors = [{ name = "Prod Tools", email = "noreply@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "mlx-lm>=0.31.1",
    "PyYAML>=6.0",
]

[project.scripts]
email_auto = "email_auto.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
