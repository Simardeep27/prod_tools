version: 1

schedule:
  timezone: America/New_York
  times:
    - "08:00"
    - "22:49"
  launchd_label: com.prodtools.email-auto

email:
  mailbox: INBOX
  unread_only: false
  lookback_hours: 24
  max_messages: 20
  max_body_chars: 6000
  allow_senders: []
  exclude_senders: []

llm:
  provider: mlx_lm
  model: mlx-community/Llama-3.2-3B-Instruct-4bit
  max_tokens: 1200

categorization_task:
  description: >
    Analyze this email and return a JSON object only.
    Assign exactly one category from: JOB/INTERNSHIP, UNIVERSITY, PERSONAL, PAYMENTS/TRANSACTIONS, OTHER.
    Assign exactly one priority from: HIGH, MEDIUM, LOW.
    Priority rules:
    - HIGH only for job or internship mail, university mail, or messages with a near deadline.
    - MEDIUM only for meaningful person-to-person communication that matters but is not urgent.
    - LOW for everything else, including promotions, newsletters, and automated notifications.
    Assign exactly one required_action from: REPLY, READ_ONLY, TASK, IGNORE.
    Include these keys:
    email_id, subject, sender, category, priority, required_action, date, deadline, key_points, recommended_next_step.
    key_points must be a short list of strings.
    deadline must be null if no deadline is stated.
  output_file: output/categorization_report.json

reporting_task:
  description: >
    Produce a concise daily inbox digest in Markdown.
    Group emails by priority and put HIGH priority items first.
    For each email, include sender, subject, why it matters, and the next action.
    Call out deadlines explicitly.
    End with an Action Queue section containing short concrete follow-ups.
    Return Markdown only.
  output_file: output/daily_summary.md
